version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
  - package-ecosystem: nuget
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      nuget:
        patterns: ['*']
  - package-ecosystem: pip
    directory: /docs
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      documentation:
        patterns: ['*']
