site_name: Library Hub
site_description: Browse Emby libraries, read private daily archives, and subscribe to updates.
site_url: https://ultreia-io.github.io/emby-library-hub/
repo_url: https://github.com/ultreia-io/emby-library-hub
repo_name: ultreia-io/emby-library-hub
edit_uri: edit/develop/docs/
site_dir: site
strict: true
hooks:
  - tools/docs-version.py
copyright: Copyright © 2026 Tony Chemit · <a href="https://ultreia.io">ultreia.io</a> · GPL-3.0-only · Library Hub {{VERSION}}
exclude_docs: |
  requirements.txt
  THIRD-PARTY-NOTICES.txt
  example-*.txt
  release-notes/
theme:
  name: material
  language: en
  font: false
  logo: assets/logo.svg
  favicon: assets/favicon.png
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: green
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: green
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: fr
          name: Français
          build: true
          site_description: Explorez vos médiathèques Emby, consultez les archives privées et abonnez-vous aux nouveautés.
          theme:
            palette:
              - scheme: default
                primary: green
                toggle:
                  icon: material/weather-night
                  name: Passer au thème sombre
              - scheme: slate
                primary: green
                toggle:
                  icon: material/weather-sunny
                  name: Passer au thème clair
          nav_translations:
            Overview: Présentation
            Getting started: Bien démarrer
            Administration guide: Guide d’administration
            User guide: Guide utilisateur
            Guide: Guide
            Reference: Références
            Archive administration: Administration des archives
            Installation: Installation
            Configuration: Configuration
            Quick start: Démarrage rapide
            Using Library Hub: Utiliser Library Hub
            Subscriptions: Abonnements
            Daily archive: Archives quotidiennes
            Browse libraries: Explorer les médiathèques
            Backup and recovery: Sauvegarde et restauration
            Troubleshooting: Dépannage
            Privacy and security: Confidentialité et sécurité
            For contributors: Contribuer
            Development: Développement
            Architecture: Architecture
            Releases: Versions et publication
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.highlight
  - pymdownx.superfences
extra_css:
  - assets/extra.css
nav:
  - Overview: index.md
  - User guide:
      - Guide: user-guide.md
      - Browse libraries: browse.md
      - Subscriptions: subscriptions.md
      - Daily archive: archive.md
  - Administration guide:
      - Guide: administration.md
      - Installation: INSTALL.md
      - Configuration: configuration.md
      - Archive administration: archive-administration.md
      - Backup and recovery: backup.md
      - Troubleshooting: troubleshooting.md
      - Privacy and security: security.md
      - Quick start: quick-start.md
  - For contributors:
      - Development: development.md
      - Architecture: architecture.md
      - Releases: releases.md
