<text x="794" y="222" font-size="21" font-weight="700" fill="#173e2d">Tâche planifiée</text>
<text x="794" y="252" font-size="16" fill="#52695b">Toutes les cinq minutes</text>
<text x="794" y="277" font-size="16" fill="#52695b">Heure d’envoi enregistrée</text>
