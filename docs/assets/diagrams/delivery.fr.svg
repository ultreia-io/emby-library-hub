<text x="425" y="483" font-size="16" fill="#52695b">Compte actif et confirmé</text>
<text x="425" y="508" font-size="16" fill="#52695b">Droits actuels + jour terminé</text>
<text x="425" y="533" font-size="16" fill="#52695b">Jour vide : aucun courriel</text>
