<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="674" viewBox="0 0 1120 674" role="img" aria-labelledby="title description" lang="fr">
<title id="title">Deux sorties, un historique commun</title><desc id="description">Les archives et les courriels ont des cycles indépendants. Générer ou réinitialiser les archives ne renvoie aucun courriel.</desc>
