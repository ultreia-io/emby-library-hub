<text x="56" y="222" font-size="21" font-weight="700" fill="#173e2d">Changements Emby</text>
<text x="56" y="252" font-size="16" fill="#52695b">Ajouts et suppressions</text>
<text x="56" y="277" font-size="16" fill="#52695b">Événements + inventaire</text>
