<text x="794" y="483" font-size="16" fill="#52695b">Au plus un rapport par jour</text>
<text x="794" y="508" font-size="16" fill="#52695b">Retard : le plus ancien d’abord</text>
<text x="794" y="533" font-size="16" fill="#52695b">Échec : nouvel essai après 1 h</text>
