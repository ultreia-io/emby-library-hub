<text x="442" y="183" text-anchor="middle" font-size="13" font-weight="700" fill="white">02</text>
<text x="425" y="222" font-size="21" font-weight="700" fill="#173e2d">Historique enregistré</text>
<text x="425" y="252" font-size="16" fill="#52695b">Journées dans le fuseau</text>
<text x="425" y="277" font-size="16" fill="#52695b">configuré par le serveur</text>
