<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="470" viewBox="0 0 1120 470" role="img" aria-labelledby="title description" lang="en">
<title id="title">An update that preserves your data</title><desc id="description">The DLL, configuration, and data together form your recovery point. A settings JSON export does not replace a complete backup.</desc>
