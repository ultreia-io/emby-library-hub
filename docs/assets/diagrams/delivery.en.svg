<path d="M929 318V350H560V368" fill="none" stroke="#5a8b71" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M715 465H764" fill="none" stroke="#5a8b71" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="36" y="150" width="310" height="171" rx="16" fill="#163d2c" opacity=".06"/>
<rect x="36" y="147" width="310" height="171" rx="16" fill="white" stroke="#d4e3d9"/>
<rect x="56" y="165" width="34" height="26" rx="8" fill="#1b6d48"/>
<text x="73" y="183" text-anchor="middle" font-size="13" font-weight="700" fill="white">01</text>
<text x="56" y="222" font-size="21" font-weight="700" fill="#173e2d">Emby changes</text>
<text x="56" y="252" font-size="16" fill="#52695b">Additions and removals</text>
<text x="56" y="277" font-size="16" fill="#52695b">Events + reconciliation</text>
<rect x="405" y="150" width="310" height="171" rx="16" fill="#163d2c" opacity=".06"/>
<rect x="405" y="147" width="310" height="171" rx="16" fill="white" stroke="#d4e3d9"/>
<rect x="425" y="165" width="34" height="26" rx="8" fill="#1b6d48"/>
<text x="442" y="183" text-anchor="middle" font-size="13" font-weight="700" fill="white">02</text>
<text x="425" y="222" font-size="21" font-weight="700" fill="#173e2d">Saved history</text>
<text x="425" y="252" font-size="16" fill="#52695b">Calendar days in the</text>
<text x="425" y="277" font-size="16" fill="#52695b">configured time zone</text>
<rect x="774" y="150" width="310" height="171" rx="16" fill="#163d2c" opacity=".06"/>
<rect x="774" y="147" width="310" height="171" rx="16" fill="white" stroke="#d4e3d9"/>
<rect x="794" y="165" width="34" height="26" rx="8" fill="#1b6d48"/>
<text x="811" y="183" text-anchor="middle" font-size="13" font-weight="700" fill="white">03</text>
<text x="794" y="222" font-size="21" font-weight="700" fill="#173e2d">Scheduled task</text>
<text x="794" y="252" font-size="16" fill="#52695b">Every five minutes</text>
<text x="794" y="277" font-size="16" fill="#52695b">Saved delivery time</text>
<rect x="36" y="381" width="310" height="196" rx="16" fill="#163d2c" opacity=".06"/>
<rect x="36" y="378" width="310" height="196" rx="16" fill="white" stroke="#9b5a26"/>
<rect x="56" y="396" width="34" height="26" rx="8" fill="#9b5a26"/>
<text x="73" y="414" text-anchor="middle" font-size="13" font-weight="700" fill="white">A</text>
<text x="56" y="453" font-size="21" font-weight="700" fill="#173e2d">HTML archive</text>
<text x="56" y="483" font-size="16" fill="#52695b">Published, saved pages</text>
<text x="56" y="508" font-size="16" fill="#52695b">Shared with all members</text>
<text x="56" y="533" font-size="16" fill="#52695b">Viewing never sends email</text>
<rect x="405" y="381" width="310" height="196" rx="16" fill="#163d2c" opacity=".06"/>
