<rect x="425" y="396" width="34" height="26" rx="8" fill="#1b6d48"/>
<text x="442" y="414" text-anchor="middle" font-size="13" font-weight="700" fill="white">B</text>
<text x="425" y="453" font-size="21" font-weight="700" fill="#173e2d">Recipient checks</text>
<text x="425" y="483" font-size="16" fill="#52695b">Active, confirmed account</text>
<text x="425" y="508" font-size="16" fill="#52695b">Current access + finished day</text>
<text x="425" y="533" font-size="16" fill="#52695b">Empty day: no email</text>
<rect x="774" y="381" width="310" height="196" rx="16" fill="#163d2c" opacity=".06"/>
<rect x="774" y="378" width="310" height="196" rx="16" fill="white" stroke="#d4e3d9"/>
