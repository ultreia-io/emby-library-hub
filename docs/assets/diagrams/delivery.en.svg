<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="674" viewBox="0 0 1120 674" role="img" aria-labelledby="title description" lang="en">
<title id="title">Two outputs, one shared history</title><desc id="description">Saved archives and subscriber emails have independent lifecycles. Generating or resetting archives never resends subscriber emails.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#5a8b71"/></marker></defs>
<rect width="1120" height="674" rx="24" fill="#f1f7f3"/>
<g font-family="DejaVu Sans,Arial,sans-serif"><text x="36" y="38" fill="#1b6d48" font-size="12" font-weight="700" letter-spacing="2">LIBRARY HUB / ADMINISTRATION</text>
<text x="36" y="79" fill="#173e2d" font-size="30" font-weight="700">Two outputs, one shared history</text>
<text x="36" y="111" fill="#52695b" font-size="17">Saved archives and subscriber emails have independent lifecycles.</text>
<path d="M346 230H395" fill="none" stroke="#5a8b71" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M715 230H764" fill="none" stroke="#5a8b71" stroke-width="2.5" marker-end="url(#arrow)"/>
