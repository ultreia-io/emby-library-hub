<text x="811" y="414" text-anchor="middle" font-size="13" font-weight="700" fill="white">→</text>
<text x="794" y="453" font-size="21" font-weight="700" fill="#173e2d">SMTP delivery</text>
<text x="794" y="483" font-size="16" fill="#52695b">At most one report per day</text>
<text x="794" y="508" font-size="16" fill="#52695b">Backlog: oldest day first</text>
<text x="794" y="533" font-size="16" fill="#52695b">Failure: retry after one hour</text>
<rect x="36" y="605" width="1048" height="42" rx="10" fill="#e2eee6"/>
<text x="55" y="632" font-size="16" font-weight="600" fill="#224d36">Generating or resetting archives never resends subscriber emails.</text></g></svg>
