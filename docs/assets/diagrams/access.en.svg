<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-labelledby="title description" lang="en">
<title id="title">One account, three access rules</title><desc id="description">The server authenticates every member. Each area applies its own access rule. Settings, backups, and the subscriber list are administrator-only.</desc>
